name: build_agent

on:
  push:
    paths:
      - "agent/cpp/**"
      - ".github/workflows/build_agent.yml"
  pull_request:
    paths:
      - "agent/cpp/**"
      - ".github/workflows/build_agent.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install OpenCV (Windows)
        run: choco install opencv -y

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-win-x86_64*"
          latest: true
          out-file-path: "deps"
          extract: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S agent/cpp -B agent/cpp/build `
            -DCMAKE_PREFIX_PATH=C:\Program Files\OpenCV\build `
            -DMAA_FRAMEWORK_DIR="${{ github.workspace }}\deps\MaaFramework"

      - name: Build
        shell: pwsh
        run: |
          cmake --build agent/cpp/build --config Release --target publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: route_recognition-win-x64
          path: agent/cpp/build/dist/
